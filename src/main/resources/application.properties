```properties
spring.application.name=first-project
server.port=8081

# Ollama Configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=codellama:latest
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.embedding.options.model=nomic-embed-text:latest

# Logging Configuration
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# MariaDB DataSource Configuration
spring.datasource.url=jdbc:mariadb://localhost:3308/springai
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root1234}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# MariaDB Vector Store Configuration
spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.distance-type=COSINE
spring.ai.vectorstore.mariadb.dimensions=768
spring.ai.vectorstore.mariadb.table-name=vector_store_768
```